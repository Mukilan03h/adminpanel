services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peoplehub
      POSTGRES_PASSWORD: peoplehub
      POSTGRES_DB: peoplehub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplehub -d peoplehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://peoplehub:peoplehub@db:5432/peoplehub
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
      SEED_ON_START: "true"
      EXPOSE_DEV_OTP: "false"
    ports:
      - "8000:8000"

volumes:
  pgdata:
