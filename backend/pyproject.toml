[project]
name = "peoplehub-api"
version = "1.0.0"
description = "PeopleHub HRMS + Work Platform API — FastAPI, PostgreSQL, JWT + MFA, RBAC."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "greenlet==3.2.4",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "pyjwt==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "pyotp==2.10.0",
    "qrcode[pil]==8.2",
    "cryptography==46.0.3",
    "slowapi==0.1.10",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.14.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
